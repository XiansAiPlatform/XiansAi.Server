name: Build and Publish to DockerHub

on:
  push:
    tags:
      - 'v*'  # This will trigger on version tags like v1.0.0, v2.1.0, etc.
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

env:
  IMAGE_NAME: xiansai-server
  DOCKERHUB_USERNAME: hasithy99x  # DockerHub login username
  DOCKERHUB_ORG: 99xio  # Organization/namespace for publishing images

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A cold build takes under 2 minutes; without a cap a stalled build would
    # run to GitHub's 6-hour hard limit.
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # Full history needed so we can determine whether the tagged commit
        # is reachable from main (see "Check which floating tags" step).
        fetch-depth: 0
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Check which floating tags this release may move
      id: latest_check
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        # Floating tags (:latest, :MAJOR, :MAJOR.MINOR) must only ever point at
        # stable releases cut from main. Manual runs, pre-releases (v1.2.0-rc1)
        # and tags from old or maintenance branches never move any of them, and
        # each one only moves if this is the highest stable release in its series.
        is_latest=false
        is_major=false
        is_minor=false
        git fetch origin main --tags --quiet
        # Highest stable (no "-suffix") tag on main matching the given glob. Tags
        # on other branches are ignored so they can't block a real main release.
        highest() { git tag -l "$1" --merged origin/main --sort=-v:refname | grep -v -e '-' | head -n1; }
        if [ "$REF_TYPE" != "tag" ]; then
          reason="not a tag push"
        elif [[ "$REF_NAME" == *-* ]]; then
          reason="pre-release tag"
        elif ! git merge-base --is-ancestor "$SHA" origin/main; then
          reason="tagged commit is not on main branch history"
        else
          version="${REF_NAME#v}"
          major="${version%%.*}"
          minor="$(echo "$version" | cut -d. -f2)"
          [ "$REF_NAME" = "$(highest "v${major}.${minor}.*")" ] && is_minor=true
          [ "$REF_NAME" = "$(highest "v${major}.*")" ] && is_major=true
          [ "$REF_NAME" = "$(highest 'v*')" ] && is_latest=true
          reason="stable release on main (highest overall is $(highest 'v*'))"
        fi
        echo "$REF_NAME: latest=$is_latest major=$is_major minor=$is_minor ($reason)"
        {
          echo "is_latest=$is_latest"
          echo "is_major=$is_major"
          echo "is_minor=$is_minor"
        } >> "$GITHUB_OUTPUT"
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          # Tag for version tags
          type=ref,event=tag
          # Semantic versioning tags
          type=semver,pattern={{version}}
          # Floating tags only move when the check above allows it
          type=semver,pattern={{major}}.{{minor}},enable=${{ steps.latest_check.outputs.is_minor == 'true' }}
          type=semver,pattern={{major}},enable=${{ steps.latest_check.outputs.is_major == 'true' }}
          type=raw,value=latest,enable=${{ steps.latest_check.outputs.is_latest == 'true' }}
        # The default latest=auto adds :latest to every semver tag push regardless of
        # the rule above, so it must be turned off.
        flavor: |
          latest=false
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=XiansAi Server - AI workflow platform
          org.opencontainers.image.vendor=${{ env.DOCKERHUB_ORG }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./XiansAi.Server.Src
        file: ./XiansAi.Server.Src/Dockerfile.production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # No build cache on purpose. "COPY . ." invalidates every stage after
        # restore on each release, so the only reusable layer is the ~15s
        # dotnet restore, while exporting a mode=max cache measured 235s.
        # Dockerfile.production cross-compiles from $BUILDPLATFORM, so both
        # architectures compile natively and a cold build finishes in ~1m45s.
        
    - name: Generate build summary
      run: |
        echo "## 🐳 Docker Image Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Eligible for :latest:** ${{ steps.latest_check.outputs.is_latest }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Docker Pull Command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY 