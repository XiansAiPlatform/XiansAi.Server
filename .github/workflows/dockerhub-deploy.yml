name: Build and Publish to DockerHub

on:
  push:
    tags:
      - 'v*'  # This will trigger on version tags like v1.0.0, v2.1.0, etc.
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

env:
  IMAGE_NAME: xiansai-server
  DOCKERHUB_USERNAME: hasithy99x  # DockerHub login username
  DOCKERHUB_ORG: 99xio  # Organization/namespace for publishing images

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A cold build takes under 2 minutes; without a cap a stalled build would
    # run to GitHub's 6-hour hard limit.
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # Full history needed so we can determine whether the tagged commit
        # is reachable from main (see "Check if tag is releasable as latest" step).
        fetch-depth: 0
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Log in to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Check if tag is releasable as latest
      id: latest_check
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        # ":latest" must only ever point at the newest stable release cut from
        # main. Manual runs, pre-releases (v1.2.0-rc1), tags from old or
        # maintenance branches, and re-pushes of older versions never move it.
        is_latest=false
        git fetch origin main --tags --quiet
        highest=$(git tag -l 'v*' --sort=-v:refname | grep -v -e '-' | head -n1)
        if [ "$REF_TYPE" != "tag" ]; then
          reason="not a tag push"
        elif [[ "$REF_NAME" == *-* ]]; then
          reason="pre-release tag"
        elif ! git merge-base --is-ancestor "$SHA" origin/main; then
          reason="tagged commit is not on main branch history"
        elif [ "$REF_NAME" != "$highest" ]; then
          reason="not the highest release (highest is $highest)"
        else
          is_latest=true
          reason="newest stable release on main"
        fi
        echo "$REF_NAME: is_latest=$is_latest ($reason)"
        echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          # Tag for version tags
          type=ref,event=tag
          # Semantic versioning tags
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          # Only when the check above says this is the newest stable release on main
          type=raw,value=latest,enable=${{ steps.latest_check.outputs.is_latest == 'true' }}
        # The default latest=auto adds :latest to every semver tag push regardless of
        # the rule above, so it must be turned off.
        flavor: |
          latest=false
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=XiansAi Server - AI workflow platform
          org.opencontainers.image.vendor=${{ env.DOCKERHUB_ORG }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./XiansAi.Server.Src
        file: ./XiansAi.Server.Src/Dockerfile.production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # No build cache on purpose. "COPY . ." invalidates every stage after
        # restore on each release, so the only reusable layer is the ~15s
        # dotnet restore, while exporting a mode=max cache measured 235s.
        # Dockerfile.production cross-compiles from $BUILDPLATFORM, so both
        # architectures compile natively and a cold build finishes in ~1m45s.
        
    - name: Generate build summary
      run: |
        echo "## 🐳 Docker Image Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Eligible for :latest:** ${{ steps.latest_check.outputs.is_latest }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Docker Pull Command:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY 