name: "Trivy Security Scan"

on:
  push:
    branches: [ main, staging, uat, production ]
  pull_request:
    branches: [ main ]
  schedule:
    # New CVEs are published against unchanged images, so rescan weekly.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_REF: xiansai-server:trivy-scan

jobs:
  repo-scan:
    name: Repo scan (Dockerfile misconfig + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pinned by commit SHA (v0.36.0): trivy-action tags were hijacked in a
      # 2026 supply-chain attack, so floating tags must not be trusted.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: sarif
          output: trivy-repo.sarif

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

  image-scan:
    name: Image scan (OS + NuGet vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the same image that dockerhub-deploy.yml publishes (amd64 only;
      # the arm64 image has the same packages) and load it locally; nothing is pushed.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./XiansAi.Server.Src
          file: ./XiansAi.Server.Src/Dockerfile.production
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}

      # Report every severity to the Security tab without failing the job ...
      - name: Run Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: sarif
          output: trivy-image.sarif

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # ... then fail the build only on HIGH/CRITICAL issues that have a fix available.
      - name: Run Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
